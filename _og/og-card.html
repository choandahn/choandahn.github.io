<!doctype html>
<!-- 공유 이미지 원본. 1200×630으로 캡처해 assets/images/og.png에 덮어씀(_og/는 Jekyll이 빌드하지 않음) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box;
    padding: 0 64px; background: #fbfaf7; color: #111;
    font-family: 'Pretendard Variable', sans-serif;
    display: flex; flex-direction: column; justify-content: center; position: relative;
  }
  .mark { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; }
  .mark .amp { color: #1450c4; }
  .lead { margin-top: 34px; font-size: 50px; font-weight: 700; letter-spacing: -0.02em; color: #444; line-height: 1.25; }
  .sub { margin-top: 18px; font-size: 30px; font-weight: 500; color: #666; letter-spacing: -0.01em; }
  .foot { position: absolute; left: 64px; bottom: 44px; font-size: 22px; color: #777; }
  .foot code { font-family: "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
  <div class="mark">Cho<span class="amp">&amp;</span>Ahn</div>
  <div class="lead">커머스 브랜드가 AI로 더 잘 팔도록</div>
  <div class="sub">GESTEL · 조앤안AX · AI와 스타트업에 대한 글</div>
  <div class="foot">조앤안 · <code>choandahn.com</code></div>
</body>
</html>
